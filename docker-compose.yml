services:
  api:
    build: .
    container_name: bot_lertisento_api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app

  worker:
    build: .
    container_name: bot_lertisento_worker
    command: celery -A app.worker.celery_app.celery_app worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app

  beat:
    build: .
    container_name: bot_lertisento_beat
    command: celery -A app.worker.celery_app.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./:/app

  db:
    image: postgres:16
    container_name: bot_lertisento_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bot_lertisento_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
