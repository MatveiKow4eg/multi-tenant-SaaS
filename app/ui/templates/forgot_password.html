{% extends "base.html" %}
{% block content %}
<section class="card" style="max-width:480px;margin:auto;">
    <h3>Восстановление пароля</h3>
    <p>Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.</p>
    <form method="post" action="/ui/forgot-password" class="stack-form">
        <label>Email
            <input type="email" name="email" required autofocus />
        </label>
        <button type="submit">Отправить письмо</button>
    </form>
    <p style="margin-top:1rem;"><a href="/ui/login">← Назад ко входу</a></p>
</section>
{% endblock %}
