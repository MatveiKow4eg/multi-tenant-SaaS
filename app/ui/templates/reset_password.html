{% extends "base.html" %}
{% block content %}
<section class="card" style="max-width:480px;margin:auto;">
    <h3>Новый пароль</h3>
    <form method="post" action="/ui/reset-password" class="stack-form">
        <input type="hidden" name="token" value="{{ token }}" />
        <label>Новый пароль <span style="color:var(--muted)">(минимум 8 символов)</span>
            <input type="password" name="password" minlength="8" required autofocus />
        </label>
        <button type="submit">Сохранить пароль</button>
    </form>
</section>
{% endblock %}
